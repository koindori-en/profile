<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IK shorts</title>
    
    <!-- 브라우저 탭 아이콘 (파비콘) -->
    <link class="js-favicon" rel="icon" href="logo.png" type="image/png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&family=Noto+Serif+KR:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #08030A; /* 더욱 깊어진 다크 보이드(Void) 블랙 */
            color: #F8FAFC;
            font-family: 'Noto Sans KR', sans-serif; 
            overflow-x: hidden;
            /* 핑크와 사이언이 교차하는 네온 매트릭스 배경 */
            background-image: 
                radial-gradient(rgba(236, 72, 153, 0.12) 1.5px, transparent 1.5px),
                radial-gradient(rgba(34, 211, 238, 0.06) 1px, transparent 1px);
            background-size: 32px 32px, 16px 16px;
            background-position: 0 0, 8px 8px;
        }

        .font-serif-kr { font-family: 'Noto Serif KR', serif; }
        .font-playfair { font-family: 'Playfair Display', serif; }

        /* 스크롤 리빌 애니메이션 */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, opacity;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* 사이버네틱 플로팅 애니메이션 (쇼츠 창) */
        @keyframes cyberFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .cyber-float {
            animation: cyberFloat 6s ease-in-out infinite;
        }

        /* 핑크 & 사이언 듀얼 스파크 애니메이션 */
        @keyframes sparkFloat {
            0%, 100% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 0.1;
            }
            50% {
                transform: translateY(-80px) rotate(180deg) scale(1.5);
                opacity: 0.8;
            }
        }
        .spark-particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            will-change: transform, opacity;
            animation: sparkFloat 12s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen bg-[#08030A] text-[#F8FAFC] antialiased selection:bg-pink-500/30">

    <!-- 모바일 환경에서 가로 스크롤 밀림 방지 -->
    <div class="relative w-full min-h-screen flex flex-col overflow-hidden">

        <!-- 핑크 베이스에 사이언 포인트가 들어간 강렬한 우주 오라 -->
        <div class="absolute top-[5%] left-[5%] w-[300px] h-[300px] sm:w-[600px] sm:h-[600px] bg-pink-600/20 rounded-full blur-[100px] sm:blur-[150px] -z-10 pointer-events-none"></div>
        <div class="absolute top-[35%] right-[-5%] w-[350px] h-[350px] sm:w-[700px] sm:h-[700px] bg-cyan-500/10 rounded-full blur-[100px] sm:blur-[160px] -z-10 pointer-events-none"></div>
        <div class="absolute bottom-[10%] left-[-10%] w-[300px] h-[300px] sm:w-[600px] sm:h-[600px] bg-rose-500/15 rounded-full blur-[90px] sm:blur-[140px] -z-10 pointer-events-none"></div>
        
        <!-- 실시간 빛나는 스파크 파티클 레이어 -->
        <div id="sparkOverlay" class="absolute inset-0 overflow-hidden pointer-events-none z-0"></div>

        <header class="sticky top-0 z-50 bg-[#08030A]/80 backdrop-blur-lg border-b border-pink-500/20 transition-all duration-300 shadow-[0_4px_30px_rgba(0,0,0,0.5)]">
            <div class="max-w-[1300px] mx-auto px-6 sm:px-10 lg:px-16 h-16 md:h-20 flex items-center justify-between">
                
                <!-- 왼쪽 상단: 핑크-사이언 그라데이션 로고 -->
                <a href="index.html" class="flex items-center group">
                    <span class="font-sans font-semibold text-xs tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-rose-300 to-cyan-300 uppercase transition-all duration-500 group-hover:drop-shadow-[0_0_15px_rgba(236,72,153,0.6)]">
                        SHORTS
                    </span>
                </a>
    
                <!-- 오른쪽 상단: 우아한 기존 HOME 버튼 유지 -->
                <a href="index.html" class="inline-flex items-center gap-2 px-5 py-2 rounded-full border border-pink-500/30 bg-pink-500/5 text-pink-50 text-xs font-semibold tracking-widest uppercase transition-all duration-300 hover:bg-pink-500 hover:text-white hover:border-pink-400 hover:shadow-[0_0_20px_rgba(236,72,153,0.4)] group">
                    <i class="fa-solid fa-house text-[10px] transition-transform duration-300 group-hover:scale-110"></i>
                    HOME
                </a>
            </div>
            <!-- 정교한 데코 라인 -->
            <div class="h-[1px] w-full bg-gradient-to-r from-pink-500/0 via-cyan-400/30 to-pink-500/0"></div>
        </header>

        <main class="max-w-[1200px] w-full mx-auto px-6 sm:px-10 lg:px-16 pt-16 md:pt-24 pb-24 flex-grow relative z-10 flex flex-col items-center">
            
            <!-- 유튜브 쇼츠 영상 패널 (가장 먼저 배치, 핑크/사이언 테마 적용) -->
            <div class="relative w-full max-w-[340px] sm:max-w-[380px] mx-auto reveal cyber-float mt-4">
                
                <!-- 재생 상태 뱃지 (올 핑크 테마 적용) -->
                <div class="absolute -top-4 left-1/2 -translate-x-1/2 z-30 inline-flex items-center gap-3 px-6 py-2 rounded-full border border-pink-500/50 bg-[#08030A]/90 shadow-[0_0_20px_rgba(236,72,153,0.5)] backdrop-blur-md">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-pink-500"></span>
                    </span>
                    <span class="text-pink-300 text-[10px] font-bold tracking-[0.2em] uppercase font-sans">Now Playing</span>
                </div>

                <!-- HUD 모서리 (핫 핑크) -->
                <div class="absolute -top-3 -left-3 w-8 h-8 border-t-2 border-l-2 border-pink-500/80 rounded-tl-lg z-20"></div>
                <div class="absolute -top-3 -right-3 w-8 h-8 border-t-2 border-r-2 border-pink-500/80 rounded-tr-lg z-20"></div>
                <div class="absolute -bottom-3 -left-3 w-8 h-8 border-b-2 border-l-2 border-pink-500/80 rounded-bl-lg z-20"></div>
                <div class="absolute -bottom-3 -right-3 w-8 h-8 border-b-2 border-r-2 border-pink-500/80 rounded-br-lg z-20"></div>
                
                <div class="relative backdrop-blur-2xl bg-[#08030A]/50 border border-pink-500/40 rounded-2xl p-4 shadow-[0_0_80px_rgba(236,72,153,0.2)] overflow-hidden group hover:border-cyan-400/60 hover:shadow-[0_0_120px_rgba(34,211,238,0.3)] transition-all duration-700">
                    
                    <!-- 내부 빛 번짐 (Pink to Cyan Hologram Glow) -->
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[150%] h-[150%] bg-gradient-to-br from-pink-500/20 to-cyan-500/20 blur-3xl -z-10 group-hover:from-pink-500/30 group-hover:to-cyan-400/30 transition-all duration-700"></div>

                    <!-- 유튜브 쇼츠 iframe -->
                    <div class="relative aspect-[9/16] w-full rounded-xl overflow-hidden shadow-2xl bg-black">
                        <iframe 
                            class="absolute inset-0 w-full h-full"
                            src="https://www.youtube.com/embed/goBav5t8DjM" 
                            title="YouTube Shorts" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>
            </div>

            <!-- 영상과 텍스트 사이의 여백 -->
            <div class="h-20 md:h-28 w-full"></div>
            
            <!-- 텍스트 설명 영역 (카드 형태 제거, 타이포그래피 중심) -->
            <div class="relative w-full max-w-4xl mx-auto reveal mb-8">
                
                <!-- 텍스트 배경에 경계 없이 은은하게 퍼지는 핑크/사이언 홀로그램 빛 번짐 -->
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[100%] h-[150%] bg-gradient-to-r from-pink-500/0 via-pink-500/10 to-cyan-500/0 blur-3xl -z-10 pointer-events-none"></div>

                <div class="text-center space-y-8 relative z-10 py-6">
                    <!-- 타이틀 섹션 -->
                    <div class="space-y-4">
                        <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white via-pink-100 to-pink-500 tracking-tighter font-playfair drop-shadow-[0_0_20px_rgba(236,72,153,0.4)] leading-tight">
                            Scribbled
                            <br class="sm:hidden" />
                            Thoughts
                        </h1>
                        <h2 class="text-lg sm:text-xl md:text-2xl font-bold text-white tracking-[0.2em] mt-3 font-serif-kr drop-shadow-[0_0_10px_rgba(255,255,255,0.3)]">
                            끄적이는 생각들
                        </h2>
                    </div>

                    <!-- 미니멀 미래지향적 구분선 (핑크 라인 & 사이언 다이아몬드 코어) -->
                    <div class="flex items-center justify-center gap-3 opacity-90 mt-8 mb-8">
                        <div class="w-16 md:w-24 h-[1px] bg-gradient-to-r from-transparent to-pink-400"></div>
                        <div class="w-1.5 h-1.5 rotate-45 bg-cyan-300 shadow-[0_0_15px_rgba(34,211,238,1)]"></div>
                        <div class="w-16 md:w-24 h-[1px] bg-gradient-to-l from-transparent to-pink-400"></div>
                    </div>

                    <!-- 본문 텍스트 -->
                    <div class="space-y-6 max-w-2xl mx-auto pt-2">
                        <p class="text-base sm:text-lg md:text-xl text-pink-100 font-medium tracking-widest font-serif-kr drop-shadow-md">
                            "짧은 메시지와 생각의 세계로 초대합니다."
                        </p>
                        <p class="text-sm sm:text-base md:text-lg text-slate-300 font-light leading-relaxed tracking-widest break-keep">
                            말씀 묵상하며 떠오른 잔잔한 지혜와 일상의 여정에서 만난<br class="hidden md:block"/> 생각의 조각들을 담백한 영상으로 담았습니다.
                        </p>
                    </div>
                </div>
            </div>

            <!-- 하단 여백 스페이서 -->
            <div class="h-16 md:h-24 w-full"></div>

            <!-- 하단 메인페이지 복귀 카드 -->
            <div class="w-full text-center reveal">
                <a href="index.html" class="inline-block p-10 md:p-14 bg-gradient-to-b from-[#08030A]/80 to-[#0B0510]/95 backdrop-blur-2xl rounded-3xl border border-pink-500/20 shadow-[0_40px_100px_rgba(0,0,0,0.8)] hover:bg-[#08030A]/90 hover:border-pink-400/50 hover:shadow-[0_40px_100px_rgba(236,72,153,0.2)] hover:-translate-y-1.5 transition-all duration-500 max-w-xl w-full group cursor-pointer">
                    <!-- 아이콘 (딥 핑크 컬러로 변경) -->
                    <i class="fa-solid fa-house-chimney-window text-pink-600 text-2xl mb-5 transition-transform duration-300 group-hover:scale-110 drop-shadow-[0_0_15px_rgba(219,39,119,0.6)]"></i>
                    
                    <h3 class="text-base md:text-lg font-light text-slate-200 tracking-wide mb-8 leading-relaxed">
                        짧은 영상으로 상쾌하셨길 바랍니다
                    </h3>
                    
                    <!-- 버튼 (핑크-사이언 호버 이펙트) -->
                    <div class="inline-flex items-center px-8 py-3.5 bg-pink-950/40 text-pink-50 border border-pink-500/30 group-hover:bg-pink-500 group-hover:text-white group-hover:border-cyan-400 transition-all duration-400 rounded-full text-xs md:text-sm font-semibold tracking-wider group-hover:shadow-[0_0_25px_rgba(236,72,153,0.5)] shadow-md">
                        메인 홈으로 평온하게 돌아가기
                    </div>
                </a>
            </div>

        </main>

        <!-- 하단 저작권 푸터 -->
        <footer class="w-full py-8 text-center bg-[#08030A]/90 backdrop-blur-md border-t border-pink-500/10 relative z-10">
            <p class="text-xs text-slate-500 tracking-wider">
                &copy; 2026 고인국목사. All rights reserved.
            </p>
        </footer>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. 스크롤 감지 및 요소 노출
            const revealElements = document.querySelectorAll(".reveal");

            const revealOnScrollObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("active");
                        observer.unobserve(entry.target);
                    }
                });
            }, {
                threshold: 0.1,
                rootMargin: "0px 0px -50px 0px"
            });

            revealElements.forEach(el => {
                revealOnScrollObserver.observe(el);
            });

            // 2. 부유하는 핑크 & 사이언 빛 스파크 파티클 생성
            const sparkOverlay = document.getElementById("sparkOverlay");
            
            function spawnSpark() {
                if (!sparkOverlay) return;
                if (sparkOverlay.children.length > 30) return; // 디바이스 메모리 보호
                
                const spark = document.createElement("div");
                spark.className = "spark-particle";
                
                // 불규칙 크기 설정
                const size = 2.0 + Math.random() * 5.0;
                spark.style.width = `${size}px`;
                spark.style.height = `${size}px`;
                spark.style.left = `${Math.random() * 95}%`;
                spark.style.top = `${Math.random() * 100}%`;
                
                // 색상 팔레트 (핫 핑크 & 일렉트릭 사이언)
                const isCyan = Math.random() > 0.6; // 60% 핑크, 40% 사이언
                if (isCyan) {
                    spark.style.backgroundColor = 'rgba(34, 211, 238, 0.8)';
                    spark.style.boxShadow = '0 0 12px rgba(34, 211, 238, 0.9), inset 0 0 4px rgba(255, 255, 255, 0.8)';
                } else {
                    spark.style.backgroundColor = 'rgba(236, 72, 153, 0.8)';
                    spark.style.boxShadow = '0 0 12px rgba(236, 72, 153, 0.9), inset 0 0 4px rgba(255, 255, 255, 0.8)';
                }
                
                // 애니메이션 지속 시간 랜덤화
                const duration = 8 + Math.random() * 12;
                spark.style.animationDuration = `${duration}s`;
                
                sparkOverlay.appendChild(spark);
                
                // 소거 주기
                setTimeout(() => {
                    spark.remove();
                }, duration * 1000);
            }

            // 초기 스폰
            for(let i=0; i<15; i++){
                spawnSpark();
            }
            // 자연스러운 흐름 생성 루프
            setInterval(spawnSpark, 1500);
        });
    </script>
</body>
</html>
