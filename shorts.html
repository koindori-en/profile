<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IK Shorts</title>
    
    <!-- 브라우저 탭 아이콘 (파비콘) -->
    <link class="js-favicon" rel="icon" href="logo.png" type="image/png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&family=Noto+Serif+KR:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #030712; /* 깊은 우주를 닮은 다크 사이언 블랙 */
            color: #F8FAFC;
            font-family: 'Noto Sans KR', sans-serif; 
            overflow-x: hidden;
            /* 사이버네틱 무드의 그리드 매트릭스 배경 */
            background-image: 
                radial-gradient(rgba(34, 211, 238, 0.08) 1.5px, transparent 1.5px),
                radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 32px 32px, 16px 16px;
            background-position: 0 0, 8px 8px;
        }

        .font-serif-kr { font-family: 'Noto Serif KR', serif; }
        .font-playfair { font-family: 'Playfair Display', serif; }

        /* 스크롤 리빌 애니메이션 */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, opacity;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* 사이버네틱 플로팅 애니메이션 (쇼츠 창) */
        @keyframes cyberFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .cyber-float {
            animation: cyberFloat 6s ease-in-out infinite;
        }

        /* 빛나는 파티클 스파크 애니메이션 */
        @keyframes sparkFloat {
            0%, 100% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 0.1;
            }
            50% {
                transform: translateY(-80px) rotate(180deg) scale(1.5);
                opacity: 0.7;
            }
        }
        .spark-particle {
            position: absolute;
            background-color: rgba(34, 211, 238, 0.6); /* 사이언 블루 파티클 */
            border-radius: 50%;
            pointer-events: none;
            will-change: transform, opacity;
            animation: sparkFloat 12s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.8);
        }
    </style>
</head>
<body class="min-h-screen bg-[#030712] text-[#F8FAFC] antialiased selection:bg-cyan-500/30">

    <!-- 모바일 환경에서 가로 스크롤 밀림 방지 -->
    <div class="relative w-full min-h-screen flex flex-col overflow-hidden">

        <!-- 미래적 공간감을 극대화하는 사이언 & 바이올렛 스포트라이트 오라 -->
        <div class="absolute top-[5%] left-[10%] w-[300px] h-[300px] sm:w-[600px] sm:h-[600px] bg-cyan-500/10 rounded-full blur-[100px] sm:blur-[150px] -z-10 pointer-events-none"></div>
        <div class="absolute top-[40%] right-[-5%] w-[350px] h-[350px] sm:w-[700px] sm:h-[700px] bg-violet-600/10 rounded-full blur-[100px] sm:blur-[160px] -z-10 pointer-events-none"></div>
        <div class="absolute bottom-[10%] left-[-10%] w-[300px] h-[300px] sm:w-[600px] sm:h-[600px] bg-cyan-400/5 rounded-full blur-[90px] sm:blur-[140px] -z-10 pointer-events-none"></div>
        
        <!-- 실시간 빛나는 스파크 파티클 레이어 -->
        <div id="sparkOverlay" class="absolute inset-0 overflow-hidden pointer-events-none z-0"></div>

        <!-- 상단 네비게이션 헤더 -->
        <header class="sticky top-0 z-50 bg-[#030712]/80 backdrop-blur-lg border-b border-white/5 transition-all duration-300 shadow-[0_4px_30px_rgba(0,0,0,0.5)]">
            <div class="max-w-[1300px] mx-auto px-6 sm:px-10 lg:px-16 h-16 md:h-20 flex items-center justify-between">
                
                <!-- 왼쪽 상단: 고딕 대문자 SHORTS (크기를 HOME과 동일하게 text-xs) -->
                <a href="index.html" class="flex items-center group">
                    <span class="font-sans font-semibold text-xs tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-white uppercase transition-all duration-500 group-hover:drop-shadow-[0_0_15px_rgba(34,211,238,0.6)]">
                        SHORTS
                    </span>
                </a>
    
                <!-- 오른쪽 상단: 우아한 기존 HOME 버튼 유지 -->
                <a href="index.html" class="inline-flex items-center gap-2 px-5 py-2 rounded-full border border-white/10 bg-white/[0.02] text-white text-xs font-semibold tracking-widest uppercase transition-all duration-300 hover:bg-white hover:text-[#050C0E] hover:border-white hover:shadow-[0_0_15px_rgba(255,255,255,0.15)] group">
                    <i class="fa-solid fa-house text-[10px] transition-transform duration-300 group-hover:scale-110"></i>
                    HOME
                </a>
            </div>
            <!-- 정교한 데코 라인 -->
            <div class="h-[1px] w-full bg-gradient-to-r from-white/0 via-white/10 to-white/0"></div>
        </header>

        <!-- 메인 컨텐츠 영역 -->
        <main class="max-w-[1200px] w-full mx-auto px-6 sm:px-10 lg:px-16 pt-16 md:pt-24 pb-24 flex-grow relative z-10 flex flex-col items-center">
            
            <!-- 유튜브 쇼츠 영상 패널을 상단으로 이동 (미래적 플로팅 창 적용) -->
            <div class="relative w-full max-w-[340px] sm:max-w-[380px] mx-auto reveal cyber-float mt-4">
                
                <!-- 재생 상태 뱃지를 영상 위로 이동 -->
                <div class="absolute -top-4 left-1/2 -translate-x-1/2 z-30 inline-flex items-center gap-3 px-6 py-2 rounded-full border border-cyan-500/50 bg-[#030712]/90 shadow-[0_0_20px_rgba(34,211,238,0.4)] backdrop-blur-md">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-cyan-400"></span>
                    </span>
                    <span class="text-cyan-300 text-[10px] font-bold tracking-[0.2em] uppercase font-sans">Now Playing</span>
                </div>

                <!-- HUD 모서리 -->
                <div class="absolute -top-3 -left-3 w-8 h-8 border-t-2 border-l-2 border-cyan-400/60 rounded-tl-lg z-20"></div>
                <div class="absolute -top-3 -right-3 w-8 h-8 border-t-2 border-r-2 border-cyan-400/60 rounded-tr-lg z-20"></div>
                <div class="absolute -bottom-3 -left-3 w-8 h-8 border-b-2 border-l-2 border-cyan-400/60 rounded-bl-lg z-20"></div>
                <div class="absolute -bottom-3 -right-3 w-8 h-8 border-b-2 border-r-2 border-cyan-400/60 rounded-br-lg z-20"></div>
                
                <div class="relative backdrop-blur-2xl bg-[#050C0E]/50 border border-cyan-500/30 rounded-2xl p-4 shadow-[0_0_80px_rgba(34,211,238,0.15)] overflow-hidden group hover:border-cyan-400/50 hover:shadow-[0_0_120px_rgba(34,211,238,0.25)] transition-all duration-700">
                    
                    <!-- 내부 빛 번짐 (Hologram Glow) -->
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[150%] h-[150%] bg-gradient-to-b from-cyan-500/10 to-violet-500/10 blur-3xl -z-10 group-hover:from-cyan-500/20 transition-all duration-700"></div>

                    <!-- 유튜브 쇼츠 iframe -->
                    <div class="relative aspect-[9/16] w-full rounded-xl overflow-hidden shadow-2xl bg-black">
                        <iframe 
                            class="absolute inset-0 w-full h-full"
                            src="https://www.youtube.com/embed/goBav5t8DjM" 
                            title="YouTube Shorts" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>
            </div>

            <!-- 영상과 텍스트 사이의 여백 -->
            <div class="h-20 md:h-28 w-full"></div>
            
            <!-- 미래적 타이포그래피 섹션 (영상 아래로 이동 및 글자 크기 2단계 축소) -->
            <div class="relative w-full max-w-4xl mx-auto reveal mb-8">
                
                <!-- 텍스트 배경에 경계 없이 은은하게 퍼지는 홀로그램 빛 번짐 -->
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[80%] h-[150%] bg-gradient-to-r from-cyan-500/0 via-cyan-500/10 to-violet-500/0 blur-3xl -z-10 pointer-events-none"></div>

                <div class="text-center space-y-10 relative z-10 py-6">
                    <!-- 타이틀 섹션 -->
                    <div class="space-y-4 md:space-y-6">
                        <!-- 글자 크기 2단계 축소 (text-5xl -> text-3xl 등) -->
                        <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white via-cyan-50 to-cyan-500 tracking-tighter font-playfair drop-shadow-[0_0_25px_rgba(34,211,238,0.25)] leading-tight">
                            Scribbled
                            <br class="sm:hidden" />
                            Thoughts
                        </h1>
                        <!-- 한글 부제목 크기 1단계 축소하여 균형 맞춤 -->
                        <h2 class="text-xl sm:text-2xl md:text-3xl font-extrabold text-white tracking-[0.25em] mt-4 font-sans drop-shadow-[0_0_15px_rgba(255,255,255,0.3)]">
                            끄적이는 생각들
                        </h2>
                    </div>

                    <!-- 미니멀 미래지향적 구분선 (다이아몬드 코어 레이저 라인) -->
                    <div class="flex items-center justify-center gap-3 opacity-80 mt-8 mb-8">
                        <div class="w-16 md:w-24 h-[1px] bg-gradient-to-r from-transparent to-cyan-400"></div>
                        <div class="w-1.5 h-1.5 rotate-45 bg-cyan-300 shadow-[0_0_12px_rgba(34,211,238,1)]"></div>
                        <div class="w-16 md:w-24 h-[1px] bg-gradient-to-l from-transparent to-cyan-400"></div>
                    </div>

                    <!-- 본문 텍스트 -->
                    <div class="space-y-6 max-w-2xl mx-auto pt-2">
                        <p class="text-lg sm:text-xl md:text-2xl text-cyan-100 font-medium tracking-widest font-serif-kr drop-shadow-md">
                            "짧은 메시지와 생각의 세계로 초대합니다."
                        </p>
                        <p class="text-sm sm:text-base md:text-lg text-slate-300 font-light leading-relaxed tracking-widest break-keep">
                            말씀 묵상하며 떠오른 잔잔한 지혜와 일상의 여정에서 만난<br class="hidden md:block"/> 생각의 조각들을 담백한 영상으로 담았습니다.
                        </p>
                    </div>
                </div>
            </div>

            <!-- 하단 여백 스페이서 -->
            <div class="h-16 md:h-24 w-full"></div>

            <!-- 하단 메인페이지 복귀 제안 섹션 -->
            <div class="w-full text-center reveal">
                <a href="index.html" class="inline-block p-10 md:p-14 bg-gradient-to-b from-[#050C0E]/60 to-[#030712]/80 backdrop-blur-2xl rounded-3xl border border-cyan-500/20 shadow-[0_40px_100px_rgba(0,0,0,0.8)] hover:bg-[#050C0E]/80 hover:border-cyan-400/40 hover:shadow-[0_40px_100px_rgba(34,211,238,0.15)] hover:-translate-y-1.5 transition-all duration-500 max-w-xl w-full group cursor-pointer">
                    <i class="fa-solid fa-house-chimney-window text-cyan-400 text-2xl mb-5 transition-transform duration-300 group-hover:scale-110 drop-shadow-[0_0_10px_rgba(34,211,238,0.5)]"></i>
                    
                    <h3 class="text-base md:text-lg font-light text-slate-200 tracking-wide mb-8 leading-relaxed">
                        짧은 영상으로 상쾌하셨길 바랍니다
                    </h3>
                    
                    <div class="inline-flex items-center px-8 py-3.5 bg-cyan-950/50 text-cyan-50 border border-cyan-500/30 group-hover:bg-cyan-400 group-hover:text-cyan-950 group-hover:border-cyan-400 transition-all duration-400 rounded-full text-xs md:text-sm font-semibold tracking-wider group-hover:shadow-[0_0_25px_rgba(34,211,238,0.4)] shadow-md">
                        메인 홈으로 평온하게 돌아가기
                    </div>
                </a>
            </div>

        </main>

        <!-- 하단 저작권 푸터 -->
        <footer class="w-full py-8 text-center bg-[#030712]/90 backdrop-blur-md border-t border-white/5 relative z-10">
            <p class="text-xs text-slate-500 tracking-wider">
                &copy; 2026 고인국목사. All rights reserved.
            </p>
        </footer>

    </div>

    <!-- 자바스크립트 엔진 (리빌 효과 및 스파크 파티클 생성) -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. 스크롤 감지 및 요소 노출
            const revealElements = document.querySelectorAll(".reveal");

            const revealOnScrollObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("active");
                        observer.unobserve(entry.target);
                    }
                });
            }, {
                threshold: 0.1,
                rootMargin: "0px 0px -50px 0px"
            });

            revealElements.forEach(el => {
                revealOnScrollObserver.observe(el);
            });

            // 2. 부유하는 사이언 빛 스파크 파티클 생성
            const sparkOverlay = document.getElementById("sparkOverlay");
            
            function spawnSpark() {
                if (!sparkOverlay) return;
                if (sparkOverlay.children.length > 25) return; // 디바이스 메모리 보호
                
                const spark = document.createElement("div");
                spark.className = "spark-particle";
                
                // 불규칙 크기 설정
                const size = 2.0 + Math.random() * 4.0;
                spark.style.width = `${size}px`;
                spark.style.height = `${size}px`;
                spark.style.left = `${Math.random() * 95}%`;
                spark.style.top = `${Math.random() * 100}%`;
                
                // 애니메이션 지속 시간 랜덤화
                const duration = 10 + Math.random() * 12;
                spark.style.animationDuration = `${duration}s`;
                
                sparkOverlay.appendChild(spark);
                
                // 소거 주기
                setTimeout(() => {
                    spark.remove();
                }, duration * 1000);
            }

            // 초기 스폰
            for(let i=0; i<10; i++){
                spawnSpark();
            }
            // 자연스러운 흐름 생성 루프
            setInterval(spawnSpark, 2000);
        });
    </script>
</body>
</html>
